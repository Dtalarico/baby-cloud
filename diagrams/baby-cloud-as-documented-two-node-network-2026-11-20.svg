<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">Baby Cloud as-documented physical network — November 20, 2026</title>
<desc id="desc">AT&amp;T BGW620-700 gateway LAN 3 connected by Ethernet to NERV TP-Link TL-SG116E switch port 1. Two Raspberry Pi 4 nodes, CASPER-01 and BALTHAZAR-02, are wired to the switch. REAPER-ONE-PC is a Windows SSH management client on the local network, but its current physical attachment and switch port are not verified. Diagram reflects documented November 8 evidence, not a live retest.</desc>
