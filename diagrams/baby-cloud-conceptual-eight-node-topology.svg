<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
<title id="title">Baby Cloud conceptual eight-node distributed cluster</title>
<desc id="desc">A proposed head or login controller above eight named Raspberry Pi compute nodes linked through a shared network. Not an approved role assignment or deployed topology.</desc>
<rect width="760" height="510" fill="#101827"/>
<text x="380" y="38" font-size="23" fill="#f8fafc" text-anchor="middle" font-family="sans-serif" font-weight="bold">BABY CLOUD — CONCEPTUAL TOPOLOGY</text>
<text x="380" y="61" font-size="13" fill="#cbd5e1" text-anchor="middle" font-family="sans-serif">Proposed Beowulf-style architecture • not yet deployed</text>
<rect x="255" y="88" width="250" height="74" rx="12" fill="#24324a" stroke="#a5b4fc" stroke-width="2"/>
<text x="380" y="119" font-size="19" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="bold">Head / login function</text>
<text x="380" y="143" font-size="14" fill="#cbd5e1" text-anchor="middle" font-family="sans-serif">Job control / MPI (proposed)</text>
<path d="M380 162 V193" stroke="#94a3b8" stroke-width="3"/>
